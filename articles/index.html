---
layout: default
title: Articles | In Pursuit...
permalink: /articles/
---

<h1>Articles</h1>
<ul>
    {% assign sorted_articles = site.articles | sort: 'date' | reverse %}
    {% for post in sorted_articles %}
    <li>
        <span class="date">{{ post.date | date: "%Y/%m/%d" }}</span>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
</ul>
